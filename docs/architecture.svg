<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <!-- Subtle Washi blueprint drafting grid -->
    <pattern id="washi-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e8e0d2" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Washi Paper Base -->
  <rect width="1120" height="700" fill="#f6f1e7"/>
  <rect width="1120" height="700" fill="url(#washi-grid)"/>
  <!-- Outer Sumi Blueprint Frame -->
  <rect x="14" y="14" width="1092" height="672" fill="none" stroke="#1c1b18" stroke-width="2"/>
  <rect x="20" y="20" width="1080" height="660" fill="none" stroke="#8a8173" stroke-width="0.8"/>

  <!-- Header -->
  <text x="40" y="56" font-size="26" font-weight="bold" letter-spacing="1" fill="#1c1b18">keisan++ ARCHITECTURE</text>
  <text x="410" y="56" font-size="22" font-weight="bold" fill="#b83a2d">C++26</text>
  <line x1="40" y1="68" x2="495" y2="68" stroke="#1c1b18" stroke-width="1.5"/>
  <text x="40" y="88" font-size="12.5" fill="#4a463e">Zero-allocation, header-only C++26 vector, tensor &amp; batched linear-algebra blueprint</text>

  <!-- K++ Brand Stamp (matching keisan++ icon) -->
  <rect x="984" y="28" width="94" height="78" fill="#ffffff" stroke="#1c1b18" stroke-width="2.5" rx="14"/>
  <text x="1008" y="81" text-anchor="middle" font-size="40" font-weight="bold" fill="#111317">K</text>
  <text x="1050" y="75" text-anchor="middle" font-size="24" font-weight="bold" fill="#ff6f00">++</text>

  <!-- Top Layer: User Application -->
  <rect x="40" y="116" width="1040" height="66" fill="#ebf0e8" stroke="#4a6b4e" stroke-width="2" rx="2"/>
  <text x="560" y="144" text-anchor="middle" font-size="11" letter-spacing="2" fill="#4a6b4e">APPLICATION LAYER</text>
  <text x="560" y="166" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#233826">build your   PDE / CFD solver | IMEX | FEM | particle simulation | numerical kernel   here</text>

  <!-- Middle Layer: 4 Sumi-Framed Modules -->
  <!-- 1. kcore -->
  <rect x="40" y="198" width="246" height="264" fill="#efece4" stroke="#1c1b18" stroke-width="2" rx="2"/>
  <rect x="40" y="198" width="246" height="28" fill="#1c1b18"/>
  <text x="163" y="217" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#f6f1e7">kcore</text>
  <text x="163" y="242" text-anchor="middle" font-size="10.5" fill="#5a554c">EXPRESSIONS &amp; EVALUATORS</text>
  <rect x="52" y="252" width="222" height="28" fill="#f9f6f0" stroke="#7a7367" stroke-width="1"/>
  <text x="163" y="270" text-anchor="middle" font-size="12.5" fill="#1c1b18">VecRef / ScalarVal</text>
  <rect x="52" y="286" width="222" height="28" fill="#f9f6f0" stroke="#7a7367" stroke-width="1"/>
  <text x="163" y="304" text-anchor="middle" font-size="12.5" fill="#1c1b18">Unary / Bin / TernaryExpr</text>
  <rect x="52" y="320" width="222" height="28" fill="#f9f6f0" stroke="#7a7367" stroke-width="1"/>
  <text x="163" y="338" text-anchor="middle" font-size="12.5" fill="#1c1b18">assign / eval_into (eval_simd)</text>
  <rect x="52" y="354" width="222" height="28" fill="#f9f6f0" stroke="#7a7367" stroke-width="1"/>
  <text x="163" y="372" text-anchor="middle" font-size="12.5" fill="#1c1b18">assign_stream (NT)</text>
  <rect x="52" y="388" width="222" height="28" fill="#f9f6f0" stroke="#7a7367" stroke-width="1"/>
  <text x="163" y="406" text-anchor="middle" font-size="12.5" fill="#1c1b18">assign_par (OpenMP)</text>
  <rect x="52" y="422" width="222" height="28" fill="#f9f6f0" stroke="#7a7367" stroke-width="1"/>
  <text x="163" y="440" text-anchor="middle" font-size="12.5" fill="#1c1b18">fma / clamp / math ops</text>

  <!-- 2. kmem -->
  <rect x="304" y="198" width="246" height="264" fill="#ebf0e8" stroke="#355239" stroke-width="2" rx="2"/>
  <rect x="304" y="198" width="246" height="28" fill="#355239"/>
  <text x="427" y="217" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#f6f1e7">kmem</text>
  <text x="427" y="242" text-anchor="middle" font-size="10.5" fill="#355239">ZERO-MALLOC &amp; VIEWS</text>
  <rect x="316" y="252" width="222" height="34" fill="#f9f6f0" stroke="#628065" stroke-width="1"/>
  <text x="427" y="273" text-anchor="middle" font-size="12.5" fill="#1c1b18">aligned_vector&lt;64&gt;</text>
  <rect x="316" y="293" width="222" height="34" fill="#f9f6f0" stroke="#628065" stroke-width="1"/>
  <text x="427" y="314" text-anchor="middle" font-size="12.5" fill="#1c1b18">std::span / std::array</text>
  <rect x="316" y="334" width="222" height="34" fill="#f9f6f0" stroke="#628065" stroke-width="1"/>
  <text x="427" y="355" text-anchor="middle" font-size="12.5" fill="#1c1b18">StridedSpan&lt;T&gt;</text>
  <rect x="316" y="375" width="222" height="34" fill="#f9f6f0" stroke="#628065" stroke-width="1"/>
  <text x="427" y="396" text-anchor="middle" font-size="12.5" fill="#1c1b18">WorkspaceArena (64B)</text>
  <rect x="316" y="416" width="222" height="34" fill="#f9f6f0" stroke="#628065" stroke-width="1"/>
  <text x="427" y="437" text-anchor="middle" font-size="12" fill="#1c1b18">KEISAN_STRICT_ZERO_MALLOC</text>

  <!-- 3. kreduce -->
  <rect x="568" y="198" width="246" height="264" fill="#e8eef2" stroke="#2b4c65" stroke-width="2" rx="2"/>
  <rect x="568" y="198" width="246" height="28" fill="#2b4c65"/>
  <text x="691" y="217" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#f6f1e7">kreduce</text>
  <text x="691" y="242" text-anchor="middle" font-size="10.5" fill="#2b4c65">REDUCTIONS &amp; NORMS</text>
  <rect x="580" y="252" width="222" height="28" fill="#f9f6f0" stroke="#5b7a91" stroke-width="1"/>
  <text x="691" y="270" text-anchor="middle" font-size="12.5" fill="#1c1b18">sum / sum_par</text>
  <rect x="580" y="286" width="222" height="28" fill="#f9f6f0" stroke="#5b7a91" stroke-width="1"/>
  <text x="691" y="304" text-anchor="middle" font-size="12.5" fill="#1c1b18">dot / dot_par</text>
  <rect x="580" y="320" width="222" height="28" fill="#f9f6f0" stroke="#5b7a91" stroke-width="1"/>
  <text x="691" y="338" text-anchor="middle" font-size="12.5" fill="#1c1b18">sum_repro / dot_repro</text>
  <rect x="580" y="354" width="222" height="28" fill="#f9f6f0" stroke="#5b7a91" stroke-width="1"/>
  <text x="691" y="372" text-anchor="middle" font-size="12.5" fill="#1c1b18">norm / norm_sq / l1 / inf</text>
  <rect x="580" y="388" width="222" height="28" fill="#f9f6f0" stroke="#5b7a91" stroke-width="1"/>
  <text x="691" y="406" text-anchor="middle" font-size="12.5" fill="#1c1b18">min_val / max_val</text>
  <rect x="580" y="422" width="222" height="28" fill="#f9f6f0" stroke="#5b7a91" stroke-width="1"/>
  <text x="691" y="440" text-anchor="middle" font-size="12.5" fill="#1c1b18">ReductionPolicy::FAST|REPRO</text>

  <!-- 4. ktensor -->
  <rect x="832" y="198" width="248" height="264" fill="#f5ede2" stroke="#8c5a2b" stroke-width="2" rx="2"/>
  <rect x="832" y="198" width="248" height="28" fill="#8c5a2b"/>
  <text x="956" y="217" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#f6f1e7">ktensor</text>
  <text x="956" y="242" text-anchor="middle" font-size="10.5" fill="#8c5a2b">MATRICES, TENSORS &amp; SOLVES</text>
  <rect x="844" y="252" width="224" height="28" fill="#f9f6f0" stroke="#ad7c4d" stroke-width="1"/>
  <text x="956" y="270" text-anchor="middle" font-size="12.5" fill="#1c1b18">matvec / matvec_fixed&lt;R,C&gt;</text>
  <rect x="844" y="286" width="224" height="28" fill="#f9f6f0" stroke="#ad7c4d" stroke-width="1"/>
  <text x="956" y="304" text-anchor="middle" font-size="12.5" fill="#1c1b18">matvec_transposed[_fixed]</text>
  <rect x="844" y="320" width="224" height="28" fill="#f9f6f0" stroke="#ad7c4d" stroke-width="1"/>
  <text x="956" y="338" text-anchor="middle" font-size="12.5" fill="#1c1b18">contract_axis (X / Y / Z)</text>
  <rect x="844" y="354" width="224" height="28" fill="#f9f6f0" stroke="#ad7c4d" stroke-width="1"/>
  <text x="956" y="372" text-anchor="middle" font-size="12.5" fill="#1c1b18">solve_nxn_batched&lt;N&gt;</text>
  <rect x="844" y="388" width="224" height="28" fill="#f9f6f0" stroke="#ad7c4d" stroke-width="1"/>
  <text x="956" y="406" text-anchor="middle" font-size="12.5" fill="#1c1b18">gather / scatter_add</text>
  <rect x="844" y="422" width="224" height="28" fill="#f9f6f0" stroke="#ad7c4d" stroke-width="1"/>
  <text x="956" y="440" text-anchor="middle" font-size="12.5" fill="#1c1b18">broadcast_multiply / AoS&lt;-&gt;SoA</text>

  <!-- Execution / Portability Layer: ksimd -->
  <rect x="40" y="478" width="1040" height="82" fill="#efeaf2" stroke="#5d4363" stroke-width="2" rx="2"/>
  <rect x="40" y="478" width="1040" height="26" fill="#5d4363"/>
  <text x="560" y="496" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="1" fill="#f6f1e7">ksimd  —  Unified Execution &amp; Portability Layer</text>
  <text x="560" y="534" text-anchor="middle" font-size="13.5" fill="#2d1e30">C++26 &lt;simd&gt; (eval / reduce / solve)   |   if !consteval (constexpr)   |   OpenMP (_par)   |   SYCL</text>

  <!-- Hardware / Backend Layer -->
  <rect x="40" y="576" width="1040" height="86" fill="#e6ecf0" stroke="#1c1b18" stroke-width="2" rx="2"/>
  <text x="560" y="608" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1b18">x86-64 (AVX2+FMA / AVX-512)   •   ARM (NEON / SVE)   •   Multi-Core CPU   •   SYCL Device   •   Scalar Fallback</text>
  <line x1="80" y1="622" x2="1040" y2="622" stroke="#b8afa0" stroke-width="1"/>
  <text x="560" y="644" text-anchor="middle" font-size="12.5" fill="#4a463e">Verified with GCC 16 (-std=c++26 -Werror)  |  ASan + UBSan  |  KEISAN_NO_INTRINSICS  |  KEISAN_STRICT_ZERO_MALLOC</text>
</svg>
