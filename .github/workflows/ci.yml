name: CI Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc_version: [12, 13, 14]
        build_type: [Release, Debug]
        arch_flags: ["-mavx2 -mfma", ""]
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC ${{ matrix.gcc_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.gcc_version }}
      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc_version }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.arch_flags }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  linux-clang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clang_version: [16, 17, 18]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang ${{ matrix.clang_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-${{ matrix.clang_version }}
      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang_version }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="-mavx2 -mfma"
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        arch: ["/arch:AVX2", ""]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_CXX_FLAGS="${{ matrix.arch }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  macos-clang:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
