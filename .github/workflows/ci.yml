name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  matrix-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - name: "Linux GCC Release (AVX2+FMA)"
            os: ubuntu-latest
            cxx: g++
            build_type: Release
            cxx_flags: "-mavx2 -mfma"
          - name: "Linux GCC Release (Default)"
            os: ubuntu-latest
            cxx: g++
            build_type: Release
            cxx_flags: ""
          - name: "Linux GCC Debug (-O0)"
            os: ubuntu-latest
            cxx: g++
            build_type: Debug
            cxx_flags: "-O0"

          # Linux Clang
          - name: "Linux Clang Release (AVX2+FMA)"
            os: ubuntu-latest
            cxx: clang++
            build_type: Release
            cxx_flags: "-mavx2 -mfma"
          - name: "Linux Clang Debug (Default)"
            os: ubuntu-latest
            cxx: clang++
            build_type: Debug
            cxx_flags: ""

          # Windows MSVC
          - name: "Windows MSVC Release (/arch:AVX2)"
            os: windows-latest
            cxx: cl
            build_type: Release
            cxx_flags: "/arch:AVX2"
          - name: "Windows MSVC Release (Default)"
            os: windows-latest
            cxx: cl
            build_type: Release
            cxx_flags: ""
          - name: "Windows MSVC Debug"
            os: windows-latest
            cxx: cl
            build_type: Debug
            cxx_flags: ""

          # macOS Apple Clang
          - name: "macOS Clang Release"
            os: macos-latest
            cxx: clang++
            build_type: Release
            cxx_flags: ""
          - name: "macOS Clang Debug"
            os: macos-latest
            cxx: clang++
            build_type: Debug
            cxx_flags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DVEC_MATH_BUILD_TESTS=ON \
            -DVEC_MATH_BUILD_BENCHMARKS=OFF

      - name: Build Test Target
        run: cmake --build build --config ${{ matrix.build_type }} --target vector_math_test

      - name: Run Tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
