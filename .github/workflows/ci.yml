name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  matrix-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC 16 (C++26)
          - name: "Linux GCC 16 Release (AVX2+FMA)"
            os: ubuntu-latest
            cxx: g++-16
            build_type: Release
            cxx_flags: "-mavx2 -mfma"
          - name: "Linux GCC 16 Release (Default)"
            os: ubuntu-latest
            cxx: g++-16
            build_type: Release
            cxx_flags: ""
          - name: "Linux GCC 16 Debug (-O0)"
            os: ubuntu-latest
            cxx: g++-16
            build_type: Debug
            cxx_flags: "-O0"

          # Linux GCC 16 Sanitizers (ASan + UBSan)
          - name: "Linux GCC 16 ASan+UBSan"
            os: ubuntu-latest
            cxx: g++-16
            build_type: Debug
            cxx_flags: "-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -mavx2 -mfma"
            build_benchmarks: "OFF"

          # Linux Clang (C++26)
          - name: "Linux Clang Release (AVX2+FMA)"
            os: ubuntu-latest
            cxx: clang++
            build_type: Release
            cxx_flags: "-mavx2 -mfma"
          - name: "Linux Clang Release (Default)"
            os: ubuntu-latest
            cxx: clang++
            build_type: Release
            cxx_flags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Ensure GCC 16 is available
        if: matrix.cxx == 'g++-16'
        run: |
          if ! command -v g++-16 >/dev/null 2>&1; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test || true
            sudo apt-get update
            sudo apt-get install -y g++-16
          fi

      - name: Ensure Clang is available
        if: matrix.cxx == 'clang++'
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Configure CMake
        run: |
          BENCH_OPT="${{ matrix.build_benchmarks }}"
          if [ -z "$BENCH_OPT" ]; then
            if [ "${{ matrix.build_type }}" = "Release" ]; then
              BENCH_OPT="ON"
            else
              BENCH_OPT="OFF"
            fi
          fi
          if [ "${{ matrix.build_type }}" = "Release" ]; then
            EXAMPLES_OPT="ON"
          else
            EXAMPLES_OPT="OFF"
          fi
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DCMAKE_CXX_STANDARD=26 \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DKEISAN_BUILD_TESTS=ON \
            -DKEISAN_BUILD_BENCHMARKS="$BENCH_OPT" \
            -DKEISAN_BUILD_EXAMPLES="$EXAMPLES_OPT"

      - name: Build Test & Benchmark Targets
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Run Examples
        if: matrix.build_type == 'Release'
        run: |
          ./build/01_fused_expressions
          ./build/02_zero_malloc_rk
          ./build/03_sum_factorization
          ./build/04_batched_imex
          ./build/05_repro_openmp

      - name: Run Regression Benchmark Smoke Check
        if: matrix.build_type == 'Release' && contains(matrix.cxx_flags, 'mavx2')
        run: ./build/regression_bench --quick

  edge-cases-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Edge Cases GCC 16 (KEISAN_STRICT_ZERO_MALLOC)"
            os: ubuntu-latest
            cxx: g++-16
            cxx_flags: "-DKEISAN_STRICT_ZERO_MALLOC"
          - name: "Edge Cases GCC 16 (KEISAN_NO_INTRINSICS)"
            os: ubuntu-latest
            cxx: g++-16
            cxx_flags: "-DKEISAN_NO_INTRINSICS"
          - name: "Edge Cases GCC 16 (KEISAN_NO_EXCEPTIONS)"
            os: ubuntu-latest
            cxx: g++-16
            cxx_flags: "-DKEISAN_NO_EXCEPTIONS"
          - name: "Edge Cases Clang (KEISAN_STRICT_ZERO_MALLOC)"
            os: ubuntu-latest
            cxx: clang++
            cxx_flags: "-DKEISAN_STRICT_ZERO_MALLOC"
          - name: "Edge Cases Clang (KEISAN_NO_INTRINSICS)"
            os: ubuntu-latest
            cxx: clang++
            cxx_flags: "-DKEISAN_NO_INTRINSICS"
          - name: "Edge Cases Clang (KEISAN_NO_EXCEPTIONS -fno-exceptions)"
            os: ubuntu-latest
            cxx: clang++
            cxx_flags: "-DKEISAN_NO_EXCEPTIONS -fno-exceptions"

    steps:
      - uses: actions/checkout@v4

      - name: Ensure GCC 16 is available
        if: matrix.cxx == 'g++-16'
        run: |
          if ! command -v g++-16 >/dev/null 2>&1; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test || true
            sudo apt-get update
            sudo apt-get install -y g++-16
          fi

      - name: Ensure Clang is available
        if: matrix.cxx == 'clang++'
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DCMAKE_CXX_STANDARD=26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DKEISAN_BUILD_TESTS=ON \
            -DKEISAN_BUILD_BENCHMARKS=OFF \
            -DKEISAN_BUILD_EXAMPLES=OFF

      - name: Build edge_cases_test
        run: cmake --build build --config Release --target edge_cases_test

      - name: Run edge_cases_test
        run: ctest --test-dir build -C Release -R '^edge_cases_test$' --output-on-failure
